spring.application.name=meal-service
server.port=${MEAL_SERVICE_PORT:8083}

# PostgreSQL (defaults match docker-compose + .env.example)
spring.datasource.url=jdbc:postgresql://127.0.0.1:${MEAL_DB_PORT:5435}/${MEAL_DB_NAME:meal_db}
spring.datasource.username=${MEAL_DB_USER:meal_svc}
spring.datasource.password=${MEAL_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# No hibernate.jdbc.time_zone: logged_at is the user's wall-clock time and must be stored as sent,
# not shifted by the server's offset.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Must equal identity-service's secret, or every token is rejected with 401.
visionfit.jwt.secret=${JWT_SECRET:visionfit-dev-jwt-secret-change-me-in-production-min-32-chars}

# Error bodies as RFC 9457 problem details instead of Spring's default HTML/JSON.
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
