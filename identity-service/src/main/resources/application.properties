spring.application.name=identity-service
# Load ../.env so the app uses the same DB password and JWT secret as docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${IDENTITY_SERVICE_PORT:8081}

# PostgreSQL (defaults match docker-compose + .env.example)
spring.datasource.url=jdbc:postgresql://127.0.0.1:${IDENTITY_DB_PORT:5433}/${IDENTITY_DB_NAME:identity_db}
spring.datasource.username=${IDENTITY_DB_USER:identity_svc}
spring.datasource.password=${IDENTITY_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (override JWT_SECRET in production)
visionfit.jwt.secret=${JWT_SECRET:visionfit-dev-jwt-secret-change-me-in-production-min-32-chars}
visionfit.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
visionfit.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# RabbitMQ (defaults match docker-compose.yml). Account events go out through the outbox table.
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# The relay marks an event sent only once RabbitMQ confirms it has the message.
spring.rabbitmq.publisher-confirm-type=simple

management.endpoints.web.exposure.include=health,info
# RabbitMQ being down must not make this service look down: logins and sign-ups still work,
# and events wait in the outbox until it is back.
management.health.rabbit.enabled=false

# Every log line starts with the request id, "-" outside a request (config/LogContext).
logging.pattern.correlation=[req=%X{requestId:--}]\ 
