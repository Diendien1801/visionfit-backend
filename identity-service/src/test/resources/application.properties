spring.datasource.url=jdbc:h2:mem:identity_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

visionfit.jwt.secret=test-jwt-secret-at-least-32-characters-long
visionfit.jwt.expiration-ms=3600000
visionfit.jwt.refresh-expiration-ms=604800000
