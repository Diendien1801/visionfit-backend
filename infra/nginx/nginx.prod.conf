# nginx inside docker-compose.prod.yml: cloudflared -> nginx:8000 -> gateway:8080 -> services.
# Same rules as the laptop's nginx.conf; only the addresses are container names on the compose network.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format visionfit '$remote_addr "$request" $status ${request_time}s '
                         'body=${request_length}B cf_ip="$http_cf_connecting_ip"';
    access_log /dev/stdout visionfit;
    error_log /dev/stderr warn;

    # Only containers on the compose network can reach this port, and the one that talks to it is
    # cloudflared, which passes on CF-Connecting-IP: Cloudflare overwrites that header at its edge.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    server {
        # No port is published to the host: the tunnel is the only way in.
        listen 8000;

        # Matches analysis-service's 6 MB request limit (5 MB photo + fields).
        client_max_body_size 6m;

        # Outer layers wait longer than inner ones: Cloudflare ~100 s > nginx 75 s > gateway 60 s.
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        location / {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            # Overwrite, never append: the gateway only ever sees the IP nginx resolved.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
