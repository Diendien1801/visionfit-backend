# nginx in front of gateway-service, for local practice on Windows.
# Path:  cloudflared (Lab 3) -> nginx 127.0.0.1:8000 -> gateway 127.0.0.1:8090 -> services
# Setup: nginx in C:\nginx (on PATH), whose conf\nginx.conf only does  include "<this file>";
# nginx/Windows resolves conf\, logs\ and temp\ against the current folder, so run it from C:\nginx:
#   cd C:\nginx   then   start nginx  ·  nginx -s reload (after an edit)  ·  nginx -s quit  ·  nginx -t

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # One line per request, with the IP nginx believes is the client's.
    log_format visionfit '$remote_addr "$request" $status ${request_time}s '
                         'body=${request_length}B cf_ip="$http_cf_connecting_ip"';
    access_log logs/visionfit-access.log visionfit;

    # The client's real IP. Only cloudflared, on this machine, is trusted to say who the client is:
    # it copies Cloudflare's CF-Connecting-IP, which Cloudflare always overwrites at its edge.
    # ponytail: behind a public Cloudflare zone (no tunnel) list Cloudflare's IP ranges here instead.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    server {
        # Loopback only: the only way in from outside is the tunnel, so no port is open on the network.
        listen 127.0.0.1:8000;

        # nginx's default is 1 MB, which would refuse most meal photos. Matches analysis-service's 6 MB.
        client_max_body_size 6m;

        # Each layer waits a bit longer than the one behind it, so the innermost one (the gateway, with its
        # problem-details 502/504) answers first: Cloudflare ~100 s > nginx 75 s > gateway 60 s.
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        location / {
            proxy_pass http://127.0.0.1:8090;   # GATEWAY_PORT in .env (8080 is taken by PEMHTTPD on this machine)
            proxy_set_header Host $host;
            # Overwrite, never append: whatever X-Forwarded-For the caller sent is thrown away and the
            # gateway (which trusts 127.0.0.1) only ever sees the IP nginx itself resolved.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
