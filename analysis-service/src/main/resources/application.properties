spring.application.name=analysis-service
# Load ../.env so the app uses the same DB password, JWT secret and Claude key as docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${ANALYSIS_SERVICE_PORT:8084}

# PostgreSQL (defaults match docker-compose + .env.example)
spring.datasource.url=jdbc:postgresql://127.0.0.1:${ANALYSIS_DB_PORT:5436}/${ANALYSIS_DB_NAME:analysis_db}
spring.datasource.username=${ANALYSIS_DB_USER:analysis_svc}
spring.datasource.password=${ANALYSIS_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# No hibernate.jdbc.time_zone: captured_at is the user's wall-clock time and must be stored as sent.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Must equal identity-service's secret, or every token is rejected with 401.
visionfit.jwt.secret=${JWT_SECRET:visionfit-dev-jwt-secret-change-me-in-production-min-32-chars}

# Claude vision. Empty key: the SDK falls back to its own credential lookup, and jobs fail without one.
visionfit.ai.api-key=${ANTHROPIC_API_KEY:}
visionfit.ai.model=claude-opus-5-5

# Photos are compressed on the phone; Claude accepts up to 5 MB per image.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Error bodies as RFC 9457 problem details instead of Spring's default HTML/JSON.
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
