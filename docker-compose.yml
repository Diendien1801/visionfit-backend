# Local infrastructure for VisionFit. Database per service: each service gets its own PostgreSQL.
# All values come from .env (copy .env.example to .env and fill it in).

name: visionfit

services:
  identity-db:
    image: postgres:18-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:?missing in .env}
      POSTGRES_USER: ${IDENTITY_DB_USER:?missing in .env}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?missing in .env}
    ports:
      # Bound to localhost only: reachable from this machine, not from the network.
      - "127.0.0.1:${IDENTITY_DB_PORT:?missing in .env}:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql
    networks:
      - visionfit-net
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${IDENTITY_DB_USER}", "-d", "${IDENTITY_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  profile-db:
    image: postgres:18-alpine
    container_name: profile-db
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME:?missing in .env}
      POSTGRES_USER: ${PROFILE_DB_USER:?missing in .env}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?missing in .env}
    ports:
      - "127.0.0.1:${PROFILE_DB_PORT:?missing in .env}:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql
    networks:
      - visionfit-net
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${PROFILE_DB_USER}", "-d", "${PROFILE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  meal-db:
    image: postgres:18-alpine
    container_name: meal-db
    environment:
      POSTGRES_DB: ${MEAL_DB_NAME:?missing in .env}
      POSTGRES_USER: ${MEAL_DB_USER:?missing in .env}
      POSTGRES_PASSWORD: ${MEAL_DB_PASSWORD:?missing in .env}
    ports:
      - "127.0.0.1:${MEAL_DB_PORT:?missing in .env}:5432"
    volumes:
      - meal-db-data:/var/lib/postgresql
    networks:
      - visionfit-net
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${MEAL_DB_USER}", "-d", "${MEAL_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  analysis-db:
    image: postgres:18-alpine
    container_name: analysis-db
    environment:
      POSTGRES_DB: ${ANALYSIS_DB_NAME:?missing in .env}
      POSTGRES_USER: ${ANALYSIS_DB_USER:?missing in .env}
      POSTGRES_PASSWORD: ${ANALYSIS_DB_PASSWORD:?missing in .env}
    ports:
      - "127.0.0.1:${ANALYSIS_DB_PORT:?missing in .env}:5432"
    volumes:
      - analysis-db-data:/var/lib/postgresql
    networks:
      - visionfit-net
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${ANALYSIS_DB_USER}", "-d", "${ANALYSIS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Message broker: identity-service publishes account events, the other services consume them.
  # Management UI on http://localhost:15672 (guest / guest unless RABBITMQ_USER/RABBITMQ_PASSWORD are set).
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    # RabbitMQ stores its data under the host name: a fixed one finds the same queues after a restart.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - visionfit-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  identity-db-data:
  profile-db-data:
  meal-db-data:
  analysis-db-data:
  rabbitmq-data:

networks:
  visionfit-net:
