# On every push, to any branch: build the five services and run every test on a fresh Linux machine.
# On main, the tested jars also become images on ghcr.io, tagged with the commit, and the server is told
# through AWS SSM to pull them and restart (infra/ec2/deploy.sh). No SSH, no open port.
name: CI
on: push
# The token GitHub hands this job may read the repo and publish images, nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build:
    # ARM like the t4g server: an image built on x86 would not start there (exec format error).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test bootJar
      - name: Push images
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p dist
          for s in identity-service profile-service meal-service analysis-service gateway-service; do
            cp "$s/build/libs/$s-0.0.1-SNAPSHOT.jar" "dist/$s.jar"
            image="ghcr.io/diendien1801/visionfit-$s"
            docker build --build-arg SERVICE="$s" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              -t "$image:${GITHUB_SHA::7}" -t "$image:latest" .
            docker push --all-tags "$image"
          done
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        # IAM user github-deploy may only send the VisionfitDeploy document (infra/ec2/ssm-deploy.yml) to this server.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
          SERVER: i-09892524bb422eacd
        run: |
          id=$(aws ssm send-command --document-name VisionfitDeploy --instance-ids "$SERVER" \
            --query Command.CommandId --output text)
          ask() { aws ssm get-command-invocation --command-id "$id" --instance-id "$SERVER" --output text --query "$1"; }
          # "aws ssm wait" gives up after 100 s, shorter than a slow deploy; poll for up to 5 minutes instead.
          for _ in $(seq 60); do
            sleep 5
            status=$(ask Status 2>/dev/null) || continue
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          ask StandardOutputContent
          ask StandardErrorContent
          echo "== Deploy: $status"
          test "$status" = Success
