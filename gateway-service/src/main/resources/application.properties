spring.application.name=gateway-service
# Load ../.env so the routes use the same service ports as everything else.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
# The only port the app talks to. Public for free: cloudflared tunnel --url http://localhost:8080
server.port=${GATEWAY_PORT:8080}

# Every service still verifies the access token itself.
# `/x/**` also matches `/x`. Paths not listed here (including the services' /actuator) get 404.
spring.cloud.gateway.server.webmvc.routes[0].id=identity
spring.cloud.gateway.server.webmvc.routes[0].uri=http://127.0.0.1:${IDENTITY_SERVICE_PORT:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/me

spring.cloud.gateway.server.webmvc.routes[1].id=profile
spring.cloud.gateway.server.webmvc.routes[1].uri=http://127.0.0.1:${PROFILE_SERVICE_PORT:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/profile/**

spring.cloud.gateway.server.webmvc.routes[2].id=meal
spring.cloud.gateway.server.webmvc.routes[2].uri=http://127.0.0.1:${MEAL_SERVICE_PORT:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/meals/**

spring.cloud.gateway.server.webmvc.routes[3].id=analysis
spring.cloud.gateway.server.webmvc.routes[3].uri=http://127.0.0.1:${ANALYSIS_SERVICE_PORT:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/analysis/**

# A service that is down fails fast (502); one that hangs is cut off (504) instead of holding the
# app's request forever. 60 s, not less: the timer also covers a 5 MB photo upload from a slow phone.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=60s

# Behind cloudflared or nginx every request comes from this machine: take the client's IP from
# X-Forwarded-For, but only from this machine (the default also trusts the LAN, where a phone could fake it).
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127.0.0.0/8, ::1/128

# Requests per caller per minute, see RateLimitFilter. The app polls an analysis once a second.
visionfit.rate-limit.auth-per-minute=20
visionfit.rate-limit.analysis-per-minute=10
visionfit.rate-limit.api-per-minute=300

# Error bodies as RFC 9457 problem details, like the services.
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info

# Not done here on purpose, it belongs in front of the gateway:
# - Cloudflare: HTTPS certificate, DDoS protection and WAF, per-IP limits at the edge, hiding the server's IP.
# - nginx (if added): a body size limit for every route (client_max_body_size), the real client IP from
#   Cloudflare's IP ranges (set_real_ip_from), accepting traffic from Cloudflare only.
# Not needed yet: retry, circuit breaker and load balancing (one instance per service), CORS (no web client).
# Token checks stay in each service: the gateway passes Authorization through untouched.
