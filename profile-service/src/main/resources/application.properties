spring.application.name=profile-service
# Load ../.env so the app uses the same DB password and JWT secret as docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${PROFILE_SERVICE_PORT:8082}

# PostgreSQL (defaults match docker-compose + .env.example)
spring.datasource.url=jdbc:postgresql://127.0.0.1:${PROFILE_DB_PORT:5434}/${PROFILE_DB_NAME:profile_db}
spring.datasource.username=${PROFILE_DB_USER:profile_svc}
spring.datasource.password=${PROFILE_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Must equal identity-service's secret, or every token is rejected with 401.
visionfit.jwt.secret=${JWT_SECRET:visionfit-dev-jwt-secret-change-me-in-production-min-32-chars}

# Error bodies as RFC 9457 problem details instead of Spring's default HTML/JSON.
spring.mvc.problemdetails.enabled=true

# RabbitMQ (defaults match docker-compose.yml): identity-service's account events arrive here (events/).
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# A message whose handling throws is tried 4 more times (after 1, 2, 4 and 8 s), then dead-lettered.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

management.endpoints.web.exposure.include=health,info
# RabbitMQ being down must not make this service look down: its API still works, events wait in the queue.
management.health.rabbit.enabled=false

# Every log line starts with the gateway's request id and the caller's uid, "-" when unknown (config/LogContext).
logging.pattern.correlation=[req=%X{requestId:--} user=%X{userId:--}]\ 
